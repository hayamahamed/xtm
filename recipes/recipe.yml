---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: template
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora/fedora-silverblue
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /
        
  - type: gnome-extensions # unavailable as .rpm therefore, should be installed via extensions
    install:
     - 3628 # ArcMenu by Andrew
     - 1708 # Transparent Top Bar by zhanghai
     
  - type: dnf # Function --> Custom packages (commonly Carbonwarp's)
    install:
      packages:

        
        - sudo-rs
        
        - https://github.com/carbonwarp/12/releases/download/cw-software-latest/cw-software.rpm
        - https://github.com/carbonwarp/12/releases/download/carbonwarp-backgrounds-latest/carbonwarp-backgrounds.rpm
        - https://github.com/carbonwarp/12/releases/download/clearui-latest/clearui.rpm
        - https://github.com/hayamahamed/xtm/releases/download/latest/a.rpm # cw icons
        
        - https://github.com/carbonwarp/12/releases/download/filee-latest/filee-arm64.rpm
        - https://github.com/carbonwarp/12/releases/download/filee-latest/filee-x86_64.rpm
      
    remove:
      packages:
        - gnome-software
        - gnome-disk-utility
        - gnome-system-monitor
        - gnome-tour
        - yelp
        - malcontent-control
        - firefox
        - firefox-langpacks
        - toolbox
        - gnome-backgrounds
        - f44-backgrounds-gnome
        - f44-backgrounds-base 
        - fedora-workstation-backgrounds
        
        - gnome-shell-extension-places-menu.noarch
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-window-list
        
  - type: script
    scripts:
        - rust.sh
        
  - type: gschema-overrides
    include:
        - zz1-wp.carbonwarp.gschema.override
        
  
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
